name: Continuous Integration and Delivery with GitHub Actions

on:
  push:
    branches:
      - "main"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Authenticate to Google Cloud
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

    - name: Configure Docker Authentication for Google Cloud Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev

    - name: Setup Java 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build Application .jar
      working-directory: rest-with-spring-boot-and-java
      run: mvn clean package

    - name: Docker Compose Build
      working-directory: .
      run: docker compose build

    - name: Tag and Push Docker Image to Google Artifact Registry
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/curso-java:latest ${{ secrets.REGISTRY_INFO }}/curso-java:latest
        docker tag ${{ secrets.DOCKER_USERNAME }}/curso-java:latest ${{ secrets.REGISTRY_INFO }}/curso-java:${{ github.run_id }}
        
        docker push ${{ secrets.REGISTRY_INFO }}/curso-java:latest
        docker push ${{ secrets.REGISTRY_INFO }}/curso-java:${{ github.run_id }}


    - name: Push to Docker Hub Container Registry
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/curso-java:latest ${{ secrets.DOCKER_USERNAME }}/curso-java:${{ github.run_id }}

        docker push ${{ secrets.DOCKER_USERNAME }}/curso-java:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/curso-java:${{ github.run_id }}
