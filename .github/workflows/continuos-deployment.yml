name: Continuous Integration and Delivery with GitHub Actions

on:
  push:
    branches:
      - "main"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/892010173943/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-actions@://gserviceaccount.com'

    - name: Set up Cloud SDK and Configure Docker
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Google Artifact Registry
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Setup Java 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build Application .jar
      working-directory: rest-with-spring-boot-and-java
      run: mvn clean package

    - name: Docker Compose Build
      working-directory: .
      run: docker compose build

    - name: Tag and Push Docker Image to Google Artifact Registry
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/curso-java:latest us-central1-docker.pkg.dev/cursojava2026-509409/carlos-registry/curso-java:latest
        docker tag ${{ secrets.DOCKER_USERNAME }}/curso-java:latest us-central1-docker.pkg.dev/cursojava2026-509409/carlos-registry/curso-java:${{ github.run_id }}
        
        docker push us-central1-docker.pkg.dev/cursojava2026-509409/carlos-registry/curso-java:latest
        docker push us-central1-docker.pkg.dev/cursojava2026-509409/carlos-registry/curso-java:${{ github.run_id }}

    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: 'curso-java-service'
        region: 'us-central1'
        image: 'us-central1-docker.pkg.dev/cursojava2026-509409/carlos-registry/curso-java:latest'
        env_vars: |
          JDBC_URL_GOOGLE=jdbc:mysql://34.135.204.81:3306/google_db?useTimezone=true&serverTimezone=UTC

    - name: Push to Docker Hub Container Registry
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/curso-java:latest ${{ secrets.DOCKER_USERNAME }}/curso-java:${{ github.run_id }}
        docker push ${{ secrets.DOCKER_USERNAME }}/curso-java:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/curso-java:${{ github.run_id }}
