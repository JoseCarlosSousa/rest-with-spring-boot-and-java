server:
  port: 8888
  
spring:
  application:
    name: rest-with-spring-boot-and-java
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    open-in-view: false
    
logging:
  level:
    root: INFO
    
springdoc:
  paths-to-scan: /api/**/v1/**
  swagger-ui:
    use-root-path: true
