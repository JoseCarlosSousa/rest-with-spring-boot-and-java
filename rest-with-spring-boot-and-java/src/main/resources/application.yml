spring:
  application:
    name: rest-with-spring-boot-and-java
  datasource:
    url: jdbc:mysql://localhost:3306/spring_boot_starter_data_jpa?useTimezone=true&serverTimezone=UTC
    username: root
    password: rootroot
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    open-in-view: false
logging:
  level:
    root: INFO
    #pt.seixal.carlos: DEBUG
spring-doc:
  paths-to-scan: /api/**/v1/**
  swagger-ui:
    use-root-path: true

