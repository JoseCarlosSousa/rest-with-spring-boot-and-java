cors:
  originPatterns: http://localhost:8080,http://localhost:5173

file:
  upload-dir: /Users/sousa/Documents/CursoOnlineComprado/UploadDir

security:
  jwt:
    token:
      secret-key: 53cr37
      expire-lenght: 3600000

email:
  subject: "Default Subject"
  message: "Default Message"

spring:
  application:
    name: rest-with-spring-boot-and-java
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/spring_boot_starter_data_jpa?useTimezone=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootroot}
  
  flyway:
    enabled: true
    locations: classpath:db/migration
  
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB

logging:
  level:
    root: INFO
    #net.sf.jasperreports.engine.*: TRACE

spring-doc:
  paths-to-scan:
    - /auth/**
    - /api/**/v1/**
  swagger-ui:
    use-root-path: true
