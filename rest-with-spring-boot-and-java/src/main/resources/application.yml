cors:
  originPatterns: http://localhost:8080,http://localhost:5173
  
file:
  upload-dir: /Users/sousa/Documents/CursoOnlineComprado/UploadDir
    
spring:
  application:
    name: rest-with-spring-boot-and-java
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://host.docker.internal:3306/spring_boot_starter_data_jpa?useTimezone=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootroot}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
      
logging:
  level:
    root: INFO
spring-doc:
  paths-to-scan: /api/**/v1/**
  swagger-ui:
    use-root-path: true
