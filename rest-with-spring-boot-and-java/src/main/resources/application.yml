spring:
  application:
    name: rest-with-spring-boot-and-java
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://host.docker.internal:3306/spring_boot_starter_data_jpa?useTimezone=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootroot}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    open-in-view: false
logging:
  level:
    root: INFO
spring-doc:
  paths-to-scan: /api/**/v1/**
  swagger-ui:
    use-root-path: true
